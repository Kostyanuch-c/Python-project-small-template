[flake8]
max-line-length = 79
max-doc-length = 72
exclude =
    .git,
    __pycache__,
    venv/,
    .idea/,

[isort]
profile = google
line_length = 79
multi_line_output = 0
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = false
ensure_newline_before_comments = true
skip =
    .git,
    __pycache__,
    venv/,
    .idea/,
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER


[black]
line-length = 79
target-version = ['py312']
skip-string-normalization = True
include = \.py$